<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <!-- Prop Guard is dark-only: dark browser chrome (iPhone Safari / Android Chrome) and no white flash before the app loads. -->
    <meta name="theme-color" content="#060A13" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Prop Guard — risk management, trade planning and journaling for prop firm traders. Plan your trade." />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background-color: #060a13;
        /* iPhone Safari: never auto-enlarge text after rotating */
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        /* No pull-to-refresh / rubber-band on the page itself (screens scroll inside the app) */
        overscroll-behavior: none;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
